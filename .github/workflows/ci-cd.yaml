name: CI CD Pipeline

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run test
        run: npm run test

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR (Github Container Registry)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-node-app:latest
            ghcr.io/${{ github.repository_owner }}/my-node-app:${{ github.sha }}

  deploy:
    name: Deploy to Minikube
    runs-on: self-hosted
    needs: build

    steps:
      - name: Check Minikube Status
        run: minikube status

      - name: Update Deployment
        run: kubectl set image deployment/my-node-app my-node-app=ghcr.io/${{ github.repository_owner }}/my-node-app:${{ github.sha }} -n development

      - name: Check Deployment
        run: kubectl rollout status deployment/my-node-app -n development --timeout=120s

      - name: Check Pods
        run: kubectl get pods -n development

      - name: Done
        run: echo "Deployment Updated"
